name: 🚀 CI/CD Pipeline - Build, Test & Deploy

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'STAGING'
        type: choice
        options:
          - PRODUCTION
          - STAGING
          - DEVELOPMENT
      submit_to_app_store:
        description: 'Also submit the already-uploaded build to App Store review (PRODUCTION only)'
        required: true
        default: false
        type: boolean
      upload_to_play_store:
        description: 'Also upload the built .aab to the Play Console internal testing track (PRODUCTION only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'
  NODE_VERSION: '24'

jobs:
  # 🔍 Determine Environment
  determine-environment:
    name: �� Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should-deploy: ${{ steps.set-env.outputs.should-deploy }}
    steps:
      - name: 📋 Set Environment Variables
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_ENV=$(echo "${{ github.event.inputs.environment }}" | tr '[:upper:]' '[:lower:]')
            echo "environment=$INPUT_ENV" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  # 🔍 Code Quality & Testing
  quality-check:
    name: 🔍 Quality Check & Tests
    runs-on: ubuntu-latest
    needs: determine-environment
    outputs:
      should-deploy: ${{ needs.determine-environment.outputs.should-deploy }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🦋 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 🔧 Flutter Analyze
        run: flutter analyze
        working-directory: packages/mobile

      - name: 🧪 Run Tests
        timeout-minutes: 15
        run: flutter test --coverage
        working-directory: packages/mobile

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: packages/mobile/coverage/lcov.info
          retention-days: 7

  # 🏗️ Build React Web App
  build-web:
    name: 🏗️ Build React Web App
    runs-on: ubuntu-latest
    needs: [determine-environment, quality-check]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/web

      - name: 📦 Install Dependencies
        run: npm install
        working-directory: packages/web

      # The one per-run web build is baked for a single environment. Regenerate
      # packages/web/.env.production with that environment's (public) Firebase
      # web config + VITE_ENVIRONMENT, plus the EnvironmentGate allowlist from
      # the per-environment repo secrets. The committed .env.production stays a
      # valid prod fallback for local builds.
      - name: 🔐 Prepare Web Environment (${{ needs.determine-environment.outputs.environment }})
        working-directory: packages/web
        env:
          TARGET_ENV: ${{ needs.determine-environment.outputs.environment }}
          VITE_ALLOWED_EMAILS_DEVELOPMENT: ${{ secrets.VITE_ALLOWED_EMAILS_DEVELOPMENT }}
          VITE_ALLOWED_EMAILS_STAGING: ${{ secrets.VITE_ALLOWED_EMAILS_STAGING }}
          VITE_ALLOWED_EMAIL_DOMAINS_DEVELOPMENT: ${{ secrets.VITE_ALLOWED_EMAIL_DOMAINS_DEVELOPMENT }}
          VITE_ALLOWED_EMAIL_DOMAINS_STAGING: ${{ secrets.VITE_ALLOWED_EMAIL_DOMAINS_STAGING }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            production)
              API_KEY="AIzaSyAPBPlwtutn6Eu3WC2nMKQoQ95yxjYPeSY"
              AUTH_DOMAIN="modulo-squares-prod.firebaseapp.com"
              PROJECT_ID="modulo-squares-prod"
              STORAGE_BUCKET="modulo-squares-prod.firebasestorage.app"
              MESSAGING_SENDER_ID="253948321735"
              APP_ID="1:253948321735:web:0f7df38ef2e47fe89ec3e2"
              ;;
            staging)
              API_KEY="AIzaSyDlK3Pm3X5e9Nw31V8SPfm8o1CvPlisoEU"
              AUTH_DOMAIN="modulo-squares-staging.firebaseapp.com"
              PROJECT_ID="modulo-squares-staging"
              STORAGE_BUCKET="modulo-squares-staging.firebasestorage.app"
              MESSAGING_SENDER_ID="838061114925"
              APP_ID="1:838061114925:web:4489f878453573b9229aa4"
              ;;
            *)
              API_KEY="AIzaSyBKRHVb9cigFuu2dxxfL3_0MaeFvypm-3I"
              AUTH_DOMAIN="modulo-squares-dev.firebaseapp.com"
              PROJECT_ID="modulo-squares-dev"
              STORAGE_BUCKET="modulo-squares-dev.firebasestorage.app"
              MESSAGING_SENDER_ID="784677197785"
              APP_ID="1:784677197785:web:17eec81cc847f1af61abc8"
              ;;
          esac

          # Trust the resolved projectId over the raw trigger label.
          VITE_ENVIRONMENT="$TARGET_ENV"
          case "$PROJECT_ID" in
            *-dev) VITE_ENVIRONMENT="development" ;;
            *-staging) VITE_ENVIRONMENT="staging" ;;
            *-prod) VITE_ENVIRONMENT="production" ;;
          esac

          # EnvironmentGate allowlist for this environment (dev/staging only;
          # prod is never gated). Repo-level secrets, env-suffixed.
          case "$VITE_ENVIRONMENT" in
            development)
              ALLOWED_EMAILS="${VITE_ALLOWED_EMAILS_DEVELOPMENT:-}"
              ALLOWED_EMAIL_DOMAINS="${VITE_ALLOWED_EMAIL_DOMAINS_DEVELOPMENT:-}"
              ;;
            staging)
              ALLOWED_EMAILS="${VITE_ALLOWED_EMAILS_STAGING:-}"
              ALLOWED_EMAIL_DOMAINS="${VITE_ALLOWED_EMAIL_DOMAINS_STAGING:-}"
              ;;
            *)
              ALLOWED_EMAILS=""
              ALLOWED_EMAIL_DOMAINS=""
              ;;
          esac

          {
            printf 'VITE_ENVIRONMENT=%s\n' "$VITE_ENVIRONMENT"
            printf 'VITE_FIREBASE_API_KEY=%s\n' "$API_KEY"
            printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$AUTH_DOMAIN"
            printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$PROJECT_ID"
            printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$STORAGE_BUCKET"
            printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$MESSAGING_SENDER_ID"
            printf 'VITE_FIREBASE_APP_ID=%s\n' "$APP_ID"
            printf 'VITE_ADSENSE_PUBLISHER_ID=%s\n' "ca-pub-5198775482699756"
            printf 'VITE_ADSENSE_SLOT_BELOW_HEADER=%s\n' "4715412267"
            printf 'VITE_ADSENSE_SLOT_ABOVE_FOOTER=%s\n' "4417809035"
            # EnvironmentGate allowlist — dev/staging only; prod is never gated.
            if [ "$VITE_ENVIRONMENT" != "production" ]; then
              if [ -n "$ALLOWED_EMAILS" ]; then
                printf 'VITE_ALLOWED_EMAILS=%s\n' "$ALLOWED_EMAILS"
              fi
              if [ -n "$ALLOWED_EMAIL_DOMAINS" ]; then
                printf 'VITE_ALLOWED_EMAIL_DOMAINS=%s\n' "$ALLOWED_EMAIL_DOMAINS"
              fi
            fi
          } > .env.production

          if [ "$VITE_ENVIRONMENT" != "production" ] \
             && [ -z "$ALLOWED_EMAILS" ] \
             && [ -z "$ALLOWED_EMAIL_DOMAINS" ]; then
            echo "::warning::No VITE_ALLOWED_EMAILS_${VITE_ENVIRONMENT^^} / VITE_ALLOWED_EMAIL_DOMAINS_${VITE_ENVIRONMENT^^} repo secret — EnvironmentGate will fail closed (no one can reach the $VITE_ENVIRONMENT web app)."
          fi

          echo "✅ Wrote packages/web/.env.production for $VITE_ENVIRONMENT (project: $PROJECT_ID)"

      - name: 🏗️ Build Web App
        run: npm run build
        working-directory: packages/web

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: packages/web/dist/
          retention-days: 7

  # 🍎 Build & Upload iOS App to TestFlight
  build-ios:
    name: 🍎 Build & Upload iOS to TestFlight
    runs-on: macos-latest
    needs: [determine-environment, quality-check]
    if: needs.determine-environment.outputs.should-deploy == 'true' && (needs.determine-environment.outputs.environment == 'production' || needs.determine-environment.outputs.environment == 'staging')
    environment: ${{ needs.determine-environment.outputs.environment }}
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🦋 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔄 Switch Mobile Configs
        run: |
          CONFIG_ENV="${{ needs.determine-environment.outputs.environment == 'production' && 'prod' || 'staging' }}"
          npm run config:$CONFIG_ENV

      - name: 📦 Flutter Dependencies
        run: flutter pub get
        working-directory: packages/mobile

      - name: 🔧 Select Xcode Version
        run: |
          # Xcode 16.4 has a provisioning-profile resolution bug with automatic signing;
          # Xcode 26.x handles it correctly. Select the latest available Xcode 26+.
          LATEST=$(ls /Applications/ | grep -E "^Xcode_2[6-9]\.[0-9]+\.app$|^Xcode_[3-9][0-9]\.[0-9]+\.app$" | sort -t_ -k2 -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "/Applications/${LATEST}"
            echo "Selected $LATEST"
          else
            echo "No Xcode 26+ found; using default $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: 💎 Install Fastlane Dependencies
        run: bundle install
        working-directory: packages/mobile/ios

      - name: 🚀 Build & Upload to TestFlight
        run: bundle exec fastlane beta
        working-directory: packages/mobile/ios
        env:
          RELEASE_NOTES: "Build ${{ github.run_number }} from ${{ github.sha }}"

  # 🤖 Build Android App Bundle
  build-android:
    name: 🤖 Build Android App Bundle
    runs-on: ubuntu-latest
    needs: [determine-environment, quality-check]
    if: needs.determine-environment.outputs.should-deploy == 'true' && (needs.determine-environment.outputs.environment == 'production' || needs.determine-environment.outputs.environment == 'staging')
    environment: ${{ needs.determine-environment.outputs.environment }}
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🦋 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔄 Switch Mobile Configs
        run: |
          CONFIG_ENV="${{ needs.determine-environment.outputs.environment == 'production' && 'prod' || 'staging' }}"
          npm run config:$CONFIG_ENV

      - name: 📦 Flutter Dependencies
        run: flutter pub get
        working-directory: packages/mobile

      - name: 🔐 Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: 🏗️ Build App Bundle
        # --build-number overrides pubspec.yaml's fixed +N suffix for this
        # build only. Without it every AAB gets the same Android versionCode,
        # so a rerun (or any upload without a source edit) is rejected by
        # Play because version codes must strictly increase. Mirrors the iOS
        # lane's ci_ios_build_number fallback (Fastfile) -- GITHUB_RUN_NUMBER
        # is a per-repo monotonically increasing counter Actions provides for
        # free, so no new secret/state is needed.
        #
        # GITHUB_RUN_NUMBER alone isn't enough: it stays fixed across reruns
        # of the same workflow run (GITHUB_RUN_ATTEMPT increments instead),
        # so a rerun would still produce a duplicate versionCode and get
        # rejected by Play the same way. Folding both into
        # run_number * 1000 + run_attempt keeps ordering monotonic (a later
        # run always outranks an earlier one, regardless of attempt count)
        # while giving every rerun its own distinct code. 1000 comfortably
        # covers any realistic attempt count and keeps the result well under
        # Android's versionCode ceiling (2^31-1) for a very long time.
        run: flutter build appbundle --release --build-number="$(( ${{ github.run_number }} * 1000 + ${{ github.run_attempt }} ))"
        working-directory: packages/mobile

      - name: 📤 Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-${{ needs.determine-environment.outputs.environment }}
          path: packages/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # 📮 Upload an already-built .aab to the Play Console internal testing track
  upload-play-store:
    name: 📮 Upload to Play Console (internal track)
    runs-on: ubuntu-latest
    needs: [determine-environment, quality-check, build-android]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_play_store == 'true' && needs.determine-environment.outputs.environment == 'production'
    environment: production
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download App Bundle Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-bundle-production
          path: packages/mobile/build/app/outputs/bundle/release/

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
          working-directory: packages/mobile/android

      - name: 💎 Install Fastlane Dependencies
        run: bundle install
        working-directory: packages/mobile/android

      - name: 📮 Upload to Play Console
        run: bundle exec fastlane internal aab_path:${{ github.workspace }}/packages/mobile/build/app/outputs/bundle/release/app-release.aab
        working-directory: packages/mobile/android

  # 📮 Submit an already-uploaded build to App Store review
  submit-app-store:
    name: 📮 Submit to App Store Review
    runs-on: macos-latest
    needs: [determine-environment, quality-check]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.submit_to_app_store == 'true' && needs.determine-environment.outputs.environment == 'production'
    environment: production
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 💎 Install Fastlane Dependencies
        run: bundle install
        working-directory: packages/mobile/ios

      - name: 📮 Submit to App Store Review
        run: bundle exec fastlane submit_to_app_store
        working-directory: packages/mobile/ios

  # 🚀 Deploy to Firebase Hosting
  deploy-web:
    name: 🔥 Deploy Web App to Firebase (${{ needs.determine-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [determine-environment, quality-check, build-web]
    if: needs.determine-environment.outputs.should-deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: packages/web/dist/

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔥 Deploy to Firebase
        run: |
          CONFIG_ENV="${{ needs.determine-environment.outputs.environment == 'development' && 'dev' || needs.determine-environment.outputs.environment == 'staging' && 'staging' || 'prod' }}"
          cp firebase.$CONFIG_ENV.json firebase.json
          PROJECT_ID="${{ needs.determine-environment.outputs.environment == 'production' && 'modulo-squares-prod' || needs.determine-environment.outputs.environment == 'staging' && 'modulo-squares-staging' || 'modulo-squares-dev' }}"
          echo "$SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          firebase use $PROJECT_ID
          firebase deploy --only hosting
        env:
          # google-github-actions style service-account-key auth, replacing
          # the deprecated `firebase deploy --token` flow -- that flow uses an
          # OAuth refresh token tied to a personal Google account, which can
          # silently expire/get revoked (see 2026-08-07 production outage).
          # A service account key doesn't expire the same way. Each GitHub
          # Environment (DEVELOPMENT/STAGING/PRODUCTION) holds its own
          # FIREBASE_SERVICE_ACCOUNT_KEY_<ENV> secret, hence the three-way
          # selection here rather than one generic secret name -- GitHub
          # Actions can't dynamically construct a secrets.* name.
          SERVICE_ACCOUNT_KEY: ${{ needs.determine-environment.outputs.environment == 'production' && secrets.FIREBASE_SERVICE_ACCOUNT_KEY_PRODUCTION || needs.determine-environment.outputs.environment == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT_KEY_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT_KEY_DEVELOPMENT }}

  # 🔥 Deploy Cloud Functions
  deploy-functions:
    name: 🔥 Deploy Functions to Firebase (${{ needs.determine-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [determine-environment, quality-check]
    if: needs.determine-environment.outputs.should-deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # packages/functions lives in a separate private repo (business logic
      # shouldn't be world-readable on this public repo). It lands at the
      # exact path it used to occupy, so firebase*.json's "source":
      # "packages/functions" keeps working unchanged.
      - name: 📥 Checkout Functions (private companion repo)
        uses: actions/checkout@v4
        with:
          repository: NelsonGrey/modulo-squares-functions
          token: ${{ secrets.FUNCTIONS_REPO_PAT }}
          ref: ${{ needs.determine-environment.outputs.environment == 'production' && 'main' || needs.determine-environment.outputs.environment == 'staging' && 'staging' || 'develop' }}
          path: packages/functions

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Function Dependencies
        run: npm install
        working-directory: packages/functions

      - name: 📦 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔥 Deploy to Firebase
        run: |
          CONFIG_ENV="${{ needs.determine-environment.outputs.environment == 'development' && 'dev' || needs.determine-environment.outputs.environment == 'staging' && 'staging' || 'prod' }}"
          cp firebase.$CONFIG_ENV.json firebase.json
          PROJECT_ID="${{ needs.determine-environment.outputs.environment == 'production' && 'modulo-squares-prod' || needs.determine-environment.outputs.environment == 'staging' && 'modulo-squares-staging' || 'modulo-squares-dev' }}"
          echo "$SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          firebase use $PROJECT_ID
          firebase deploy --only functions
        env:
          # See deploy-web's identical comment: service-account-key auth
          # replacing the deprecated --token flow.
          SERVICE_ACCOUNT_KEY: ${{ needs.determine-environment.outputs.environment == 'production' && secrets.FIREBASE_SERVICE_ACCOUNT_KEY_PRODUCTION || needs.determine-environment.outputs.environment == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT_KEY_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT_KEY_DEVELOPMENT }}

  # 📊 Deployment Summary
  deployment-summary:
    name: 📊 Deployment Summary (${{ needs.determine-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-web, deploy-functions]
    if: always() && needs.determine-environment.outputs.should-deploy == 'true'
    steps:
      - name: 📊 Generate Deployment Report
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          echo "## 🔥 Firebase Deployment Summary - $ENVIRONMENT Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-----|" >> $GITHUB_STEP_SUMMARY

          if [[ "$ENVIRONMENT" == "production" ]]; then
            WEB_URL="https://modulo-squares-prod.web.app"
          elif [[ "$ENVIRONMENT" == "staging" ]]; then
            WEB_URL="https://modulo-squares-staging.web.app"
          else
            WEB_URL="https://modulo-squares-dev.web.app"
          fi

          echo "| 🌐 Web App | ${{ needs.deploy-web.result }} | $WEB_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔥 Functions | ${{ needs.deploy-functions.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "**Platform**: ⚛️ React Website + GitHub Releases" >> $GITHUB_STEP_SUMMARY
