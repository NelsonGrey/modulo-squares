name: modulo_squares
version: 1.0.1+4
description: Modulo Squares - A puzzle game with leaderboard.
publish_to: "none"

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  firebase_core: ^4.14.0
  flutter_lints: ^6.0.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  # Pinned to ^0.20.2: flutter_localizations (Flutter 3.44.2) depends on
  # intl 0.20.2 exactly, so ^0.20.3 breaks `flutter pub get` version solving.
  # Dependabot is told to leave this alone in .github/dependabot.yml.
  intl: ^0.20.2
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  # Capped below 9.1.0: 9.1.0 added FLTAdPreloader.h + a non-modular
  # `#import <GoogleMobileAds/GoogleMobileAds_Beta.h>` in FLTAd_Internal.h, which
  # fails the iOS Release archive under -Werror,-Wnon-modular-include-in-framework-module
  # (the Podfile CLANG_ALLOW_NON_MODULAR_INCLUDES override does not suppress it in
  # the archive build). 9.0.0 has neither; the ad-preloader feature is unused.
  # Dependabot is told to leave this alone in .github/dependabot.yml.
  google_mobile_ads: ">=9.0.0 <9.1.0"
  get_it: ^9.2.1
  provider: ^6.1.2
  app_tracking_transparency: ^2.0.7
  in_app_purchase: ^3.3.0
  firebase_app_check: ^0.4.7
  crypto: ^3.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # mockito and build_runner are capped for the same reason: their newer
  # releases require analyzer >=13.3.0 -> meta ^1.18.3, but flutter_test
  # (Flutter 3.44.2) pins meta 1.18.0, which breaks `flutter pub get` version
  # solving. Lift both when the Flutter SDK is upgraded.
  # (Regressions: mockito PR #262, build_runner PR #261.)
  mockito: ">=5.7.0 <5.8.0"
  build_runner: ">=2.4.9 <2.15.2"
  flutter_launcher_icons: ^0.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#1a1a1a"
    theme_color: "#4CAF50"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
